<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inquiries — Nonesi Lodge Admin</title>
</head>
<body>
<div class="main">
  <div class="topbar">
    <button class="menu-toggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 class="topbar-title">Inquiries</h1>
    <div class="topbar-actions"></div>
  </div>
  <div class="page-body">
    <p style="color:var(--muted);margin-bottom:20px;font-size:13px">Booking inquiries from guests. Update the status as you follow up with each guest.</p>

    <!-- Filter bar -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="">All</button>
      <button class="filter-btn" data-filter="new">New</button>
      <button class="filter-btn" data-filter="contacted">Contacted</button>
      <button class="filter-btn" data-filter="confirmed">Confirmed</button>
      <button class="filter-btn" data-filter="cancelled">Cancelled</button>
    </div>

    <!-- Status pills -->
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px" id="status-pills"></div>

    <div style="overflow-x:auto;border-radius:16px">
    <table>
      <thead><tr><th>Guest</th><th>Dates</th><th>Room</th><th>Guests</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="inquiries-body"><tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted)">Loading…</td></tr></tbody>
    </table>
    </div>
  </div>
</div>

<!-- DETAIL / EDIT MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal" style="max-width:620px">
    <div class="modal-header">
      <span class="modal-title" id="modal-guest-name">Inquiry</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modal-body" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px"></div>
    <div class="form-grid">
      <div class="form-group">
        <label>Status</label>
        <select id="edit-status">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="confirmed">Confirmed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="form-group form-full">
        <label>Internal notes</label>
        <textarea id="edit-notes" rows="3" placeholder="e.g. Guest confirmed arrival time, needs late check-out…"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <a class="btn btn-gold" id="wa-link" href="#" target="_blank">Reply on WhatsApp</a>
      <button type="button" class="btn btn-outline" onclick="closeModal()">Close</button>
      <button type="button" class="btn btn-primary" id="save-status-btn" onclick="saveInquiry()">Save</button>
    </div>
  </div>
</div>

<script src="js/demo-data.js"></script>
<script src="js/admin-shell.js"></script>
<script>
let currentFilter = '';
let currentId     = null;

document.addEventListener('DOMContentLoaded', () => {
  renderShell('inquiries');
  renderPills();
  renderInquiries();

  document.getElementById('filter-bar').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderInquiries();
  });
});

function renderPills() {
  const inquiries = DemoData.getInquiries();
  const counts = { new: 0, contacted: 0, confirmed: 0, cancelled: 0 };
  inquiries.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });
  const colors = { new: 'badge-new', contacted: 'badge-contacted', confirmed: 'badge-confirmed', cancelled: 'badge-cancelled' };
  document.getElementById('status-pills').innerHTML = Object.entries(counts)
    .map(([s, c]) => `<span class="badge ${colors[s]}" style="font-size:12px;padding:5px 14px">${s}: ${c}</span>`).join('');
}

function renderInquiries() {
  const all = DemoData.getInquiries()
    .slice()
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const filtered = currentFilter ? all.filter(r => r.status === currentFilter) : all;

  const tbody = document.getElementById('inquiries-body');
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted)">No inquiries found.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(r => `
    <tr>
      <td>
        <strong>${r.guest_name}</strong><br>
        <span style="color:var(--muted);font-size:12px">${r.phone || ''}</span>
      </td>
      <td style="font-size:12px">
        ${formatDate(r.check_in)}<br>
        <span style="color:var(--muted)">→ ${formatDate(r.check_out)}</span>
      </td>
      <td style="font-size:12px">${r.room_pref || '—'}</td>
      <td style="font-size:12px">${r.adults} adult${r.adults !== 1 ? 's' : ''}${r.children ? ', ' + r.children + ' child' + (r.children !== 1 ? 'ren' : '') : ''}</td>
      <td><span class="badge badge-${r.status}">${r.status}</span></td>
      <td><button class="btn btn-outline btn-sm" onclick='openDetail(${r.id})'>View / Edit</button></td>
    </tr>`).join('');
}

function openDetail(id) {
  const r = DemoData.getInquiries().find(i => i.id === id);
  if (!r) return;
  currentId = r.id;

  document.getElementById('modal-guest-name').textContent = r.guest_name;
  document.getElementById('edit-status').value = r.status;
  document.getElementById('edit-notes').value  = r.notes || '';

  const phone = r.phone || '';
  const waNum = phone.replace(/\D/g, '');
  const waMsg = encodeURIComponent(`Hi ${r.guest_name}, thank you for your inquiry at Nonesi Lodge. `);
  const waHref = waNum ? `https://wa.me/${waNum.startsWith('0') ? '27' + waNum.slice(1) : waNum}?text=${waMsg}` : '#';
  document.getElementById('wa-link').href = waHref;
  document.getElementById('wa-link').style.opacity = waNum ? '1' : '0.4';

  const field = (label, value) => value !== undefined && value !== null && value !== ''
    ? `<div><div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px">${label}</div><div style="font-size:13px;color:var(--ink)">${value}</div></div>` : '';

  document.getElementById('modal-body').innerHTML = [
    field('Phone', r.phone),
    field('Email', r.email),
    field('Check-in', formatDate(r.check_in)),
    field('Check-out', formatDate(r.check_out)),
    field('Adults', r.adults),
    field('Children', r.children),
    field('Room preference', r.room_pref),
    field('Notes', r.notes),
    field('Received', formatDate(r.created_at)),
  ].join('');

  document.getElementById('modal').classList.add('open');
}

function saveInquiry() {
  if (currentId === null) return;
  const inquiries = DemoData.getInquiries();
  const idx = inquiries.findIndex(i => i.id === currentId);
  if (idx === -1) return;
  inquiries[idx].status = document.getElementById('edit-status').value;
  inquiries[idx].notes  = document.getElementById('edit-notes').value.trim();
  DemoData.saveInquiries(inquiries);
  showToast('Inquiry updated.', 'success');
  closeModal();
  renderPills();
  renderInquiries();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  currentId = null;
}
</script>
</body>
</html>
