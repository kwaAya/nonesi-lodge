<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inquiries — Admin</title>
</head>
<body>
<div class="main">
  <div class="topbar">
    <button class="menu-toggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 class="topbar-title">Inquiries</h1>
    <div class="topbar-actions">
      <select id="status-filter" class="form-group" style="padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:12px;color:var(--ink);background:var(--bg)">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="confirmed">Confirmed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
  </div>
  <div class="page-body">
    <p style="color:var(--muted);margin-bottom:24px;font-size:13px">Booking inquiries received via WhatsApp. Update the status as you follow up with each guest.</p>

    <!-- Stats pills -->
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px" id="status-pills"></div>

    <table>
      <thead><tr><th>Guest</th><th>Dates</th><th>Room preference</th><th>Status</th><th>Received</th><th>Actions</th></tr></thead>
      <tbody id="inquiries-body"><tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted)">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- DETAIL / EDIT MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal" style="max-width:620px">
    <div class="modal-header">
      <span class="modal-title" id="modal-guest-name">Inquiry</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modal-body" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px"></div>
    <div class="form-grid">
      <div class="form-group">
        <label>Status</label>
        <select id="edit-status">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="confirmed">Confirmed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="form-group form-full">
        <label>Internal notes</label>
        <textarea id="edit-notes" rows="3" placeholder="e.g. Guest confirmed arrival time, needs late check-out…"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <a class="btn btn-gold" id="wa-link" href="#" target="_blank">Reply on WhatsApp</a>
      <button type="button" class="btn btn-outline" onclick="closeModal()">Close</button>
      <button type="button" class="btn btn-primary" id="save-status-btn">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/admin-shell.js"></script>
<script>
let sb;
let currentId = null;
(async () => {
  sb = await authGuard();
  if (!sb) return;
  renderShell('inquiries');
  loadInquiries();

  document.getElementById('status-filter').addEventListener('change', loadInquiries);
})();

async function loadInquiries() {
  const filter = document.getElementById('status-filter').value;
  let query = sb.from('inquiries').select('*').order('created_at', { ascending: false });
  if (filter) query = query.eq('status', filter);
  const { data, error } = await query;

  // Status pills
  const { data: counts } = await sb.rpc ? await sb.from('inquiries').select('status') : { data: null };
  renderPills(data);

  const tbody = document.getElementById('inquiries-body');
  if (error || !data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted)">${error ? 'Error loading.' : 'No inquiries found.'}</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(r => `
    <tr>
      <td>
        <strong>${r.guest_name}</strong><br>
        <span style="color:var(--muted);font-size:12px">${r.phone || ''}</span><br>
        <span style="color:var(--muted);font-size:12px">${r.email || ''}</span>
      </td>
      <td style="font-size:13px">
        ${r.check_in || '—'}<br>
        <span style="color:var(--muted)">→ ${r.check_out || '—'}</span>
      </td>
      <td style="font-size:13px">${r.room_pref || '—'}<br><span style="color:var(--muted);font-size:11px">${r.adults || 2} adults${r.children ? ', ' + r.children + ' children' : ''}</span></td>
      <td><span class="badge badge-${r.status}">${r.status}</span></td>
      <td style="color:var(--muted);font-size:12px">${formatDate(r.created_at)}</td>
      <td><button class="btn btn-outline btn-sm" onclick='openDetail(${JSON.stringify(r)})'>View</button></td>
    </tr>`).join('');
}

function renderPills(data) {
  if (!data) return;
  const counts = { new: 0, contacted: 0, confirmed: 0, cancelled: 0 };
  data.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });
  const colors = { new: 'badge-new', contacted: 'badge-contacted', confirmed: 'badge-confirmed', cancelled: 'badge-cancelled' };
  document.getElementById('status-pills').innerHTML = Object.entries(counts)
    .map(([s, c]) => `<span class="badge ${colors[s]}" style="font-size:12px;padding:5px 14px">${s}: ${c}</span>`).join('');
}

function openDetail(r) {
  currentId = r.id;
  document.getElementById('modal-guest-name').textContent = r.guest_name;
  document.getElementById('edit-status').value  = r.status;
  document.getElementById('edit-notes').value   = r.notes || '';

  const phone = r.phone || '';
  const waNum = phone.replace(/\D/g, '');
  const waMsg = encodeURIComponent(`Hi ${r.guest_name}, thank you for your inquiry at Nonesi Lodge. `);
  document.getElementById('wa-link').href = waNum ? `https://wa.me/${waNum.startsWith('0') ? '27' + waNum.slice(1) : waNum}?text=${waMsg}` : '#';
  if (!waNum) document.getElementById('wa-link').style.opacity = '0.4';

  const field = (label, value) => value ? `<div><div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px">${label}</div><div style="font-size:13px;color:var(--ink)">${value}</div></div>` : '';
  document.getElementById('modal-body').innerHTML = [
    field('Phone', r.phone),
    field('Email', r.email),
    field('Check-in', r.check_in),
    field('Check-out', r.check_out),
    field('Adults', r.adults),
    field('Children', r.children),
    field('Room preference', r.room_pref),
    field('Message', r.message),
    field('Source', r.source),
    field('Received', formatDate(r.created_at)),
  ].join('');

  document.getElementById('modal').classList.add('open');
}

document.getElementById('save-status-btn').addEventListener('click', async () => {
  if (!currentId) return;
  const { error } = await sb.from('inquiries').update({
    status: document.getElementById('edit-status').value,
    notes:  document.getElementById('edit-notes').value.trim(),
  }).eq('id', currentId);

  if (error) { showToast('Error: ' + error.message, 'error'); return; }
  showToast('Inquiry updated.', 'success');
  closeModal();
  loadInquiries();
});

function closeModal() { document.getElementById('modal').classList.remove('open'); currentId = null; }
</script>
</body>
</html>
