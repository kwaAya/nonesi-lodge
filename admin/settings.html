<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Nonesi Lodge Admin</title>
</head>
<body>
<div class="main">
  <div class="topbar">
    <button class="menu-toggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 class="topbar-title">Settings</h1>
    <div class="topbar-actions">
      <button class="btn btn-primary btn-sm" id="save-btn">Save Settings</button>
    </div>
  </div>
  <div class="page-body">
    <p style="color:var(--muted);margin-bottom:28px;font-size:13px">Lodge-wide settings. Changes are saved locally in this demo.</p>

    <div style="max-width:640px;display:flex;flex-direction:column;gap:32px">

      <!-- Check-in / Check-out -->
      <div style="background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow-card)">
        <div class="section-title" style="margin-bottom:16px">Check-in &amp; Check-out</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Check-in time</label>
            <input type="time" id="s-checkin">
          </div>
          <div class="form-group">
            <label>Check-out time</label>
            <input type="time" id="s-checkout">
          </div>
        </div>
      </div>

      <!-- Contact info -->
      <div style="background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow-card)">
        <div class="section-title" style="margin-bottom:16px">Contact Info</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Phone 1</label>
            <input type="text" id="s-phone1" placeholder="072 570 3772">
          </div>
          <div class="form-group">
            <label>Phone 2</label>
            <input type="text" id="s-phone2" placeholder="071 414 7919">
          </div>
          <div class="form-group form-full">
            <label>Email</label>
            <input type="email" id="s-email" placeholder="nonesilodge@gmail.com">
          </div>
          <div class="form-group form-full">
            <label>Address</label>
            <textarea id="s-address" rows="2" placeholder="24 Komani Street, Southbourne, Komani (Queenstown), 5320"></textarea>
          </div>
        </div>
      </div>

      <!-- Lodge identity -->
      <div style="background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow-card)">
        <div class="section-title" style="margin-bottom:16px">Lodge Identity</div>
        <div class="form-grid">
          <div class="form-group form-full">
            <label>Lodge name</label>
            <input type="text" id="s-name" placeholder="Nonesi Lodge">
          </div>
          <div class="form-group form-full">
            <label>Tagline</label>
            <input type="text" id="s-tagline" placeholder="B&B & Self-Catering Accommodation in Komani, Queenstown">
          </div>
        </div>
      </div>

      <div style="padding-top:8px">
        <button class="btn btn-primary" id="save-btn-2">Save Settings</button>
      </div>
    </div>
  </div>
</div>

<script src="js/demo-data.js"></script>
<script src="js/admin-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderShell('settings');
  loadSettings();

  document.getElementById('save-btn').addEventListener('click', saveSettings);
  document.getElementById('save-btn-2').addEventListener('click', saveSettings);
});

function loadSettings() {
  const s = DemoData.getSettings();
  document.getElementById('s-checkin').value  = s.check_in_time  || '14:00';
  document.getElementById('s-checkout').value = s.check_out_time || '10:00';
  document.getElementById('s-phone1').value   = s.phone1   || '';
  document.getElementById('s-phone2').value   = s.phone2   || '';
  document.getElementById('s-email').value    = s.email    || '';
  document.getElementById('s-address').value  = s.address  || '';
  document.getElementById('s-name').value     = s.lodge_name || '';
  document.getElementById('s-tagline').value  = s.tagline  || '';
}

function saveSettings() {
  const s = {
    check_in_time:  document.getElementById('s-checkin').value,
    check_out_time: document.getElementById('s-checkout').value,
    phone1:         document.getElementById('s-phone1').value.trim(),
    phone2:         document.getElementById('s-phone2').value.trim(),
    email:          document.getElementById('s-email').value.trim(),
    address:        document.getElementById('s-address').value.trim(),
    lodge_name:     document.getElementById('s-name').value.trim(),
    tagline:        document.getElementById('s-tagline').value.trim(),
  };
  DemoData.saveSettings(s);
  showToast('Settings saved!', 'success');
}
</script>
</body>
</html>
