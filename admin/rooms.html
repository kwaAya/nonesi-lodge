<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooms — Nonesi Lodge Admin</title>
<style>
/* Anti-FOUC: set background and hide body until shell CSS is injected */
:root{--green:#2C4235;--gold:#C86D51;--bg:#FBF9F5;--surface:#F2EFE8;--sidebar:220px}
html{background:var(--bg)}
body{visibility:hidden;background:var(--bg);margin:0;font-family:system-ui,sans-serif}
body.ready{visibility:visible}

/* Room detail drawer */
.room-drawer-backdrop{position:fixed;inset:0;background:rgba(10,16,12,.5);backdrop-filter:blur(6px);z-index:500;display:none;align-items:flex-end;justify-content:flex-end}
.room-drawer-backdrop.open{display:flex}
.room-drawer{background:var(--bg);width:100%;max-width:480px;height:100%;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2);display:flex;flex-direction:column}
@media(max-width:600px){.room-drawer{max-width:100%;height:85vh;border-radius:20px 20px 0 0}}
.room-drawer-img{width:100%;aspect-ratio:16/9;object-fit:cover;flex-shrink:0;background:var(--surface)}
.room-drawer-body{padding:28px 28px 40px;flex:1}
.room-drawer-eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.room-drawer-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.8rem;color:var(--green);margin-bottom:4px;line-height:1.1}
.room-drawer-price{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;color:var(--gold);margin-bottom:16px}
.room-drawer-specs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.room-drawer-specs span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(44,66,53,.08);color:var(--green);padding:5px 12px;border-radius:999px}
.room-drawer-desc{font-size:14px;line-height:1.72;color:#6B6F6C;margin-bottom:20px}
.room-drawer-amenities{list-style:none;display:flex;flex-direction:column;gap:9px;margin-bottom:28px}
.room-drawer-amenities li{font-size:13px;color:#2B2D2F;display:flex;align-items:center;gap:10px}
.room-drawer-amenities li::before{content:'✓';color:var(--gold);font-weight:700;flex-shrink:0}
.room-drawer-actions{display:flex;gap:10px;padding-top:20px;border-top:1px solid rgba(44,66,53,.11)}
.room-drawer-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.35);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
</style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <button class="menu-toggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 class="topbar-title">Rooms</h1>
    <div class="topbar-actions">
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ Add Room</button>
    </div>
  </div>
  <div class="page-body">
    <p style="color:var(--muted);margin-bottom:28px;font-size:13px;line-height:1.65">
      Manage your room types, pricing, and availability. All changes are saved locally in this demo.
    </p>
    <div class="rooms-grid" id="rooms-grid">
      <div style="text-align:center;padding:40px;color:var(--muted)">Loading…</div>
    </div>
  </div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Add Room</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <form id="room-form">
      <input type="hidden" id="f-id">
      <div class="form-grid">
        <div class="form-group form-full">
          <label>Room name</label>
          <input type="text" id="f-name" required placeholder="e.g. Deluxe Double Room">
        </div>
        <div class="form-group">
          <label>Price (R / night)</label>
          <input type="number" id="f-price" required placeholder="700" min="0">
        </div>
        <div class="form-group">
          <label>Sleeps</label>
          <input type="number" id="f-sleeps" required placeholder="2" min="1">
        </div>
        <div class="form-group">
          <label>Size (m²)</label>
          <input type="number" id="f-size" placeholder="16" min="0">
        </div>
        <div class="form-group">
          <label>Bed type</label>
          <input type="text" id="f-bed" placeholder="Double bed">
        </div>
        <div class="form-group">
          <label>Bathroom</label>
          <input type="text" id="f-bathroom" placeholder="Private bathroom">
        </div>
        <div class="form-group form-full">
          <label>Image path</label>
          <input type="text" id="f-image" placeholder="../images/room-twin.png">
        </div>
        <div class="form-group form-full">
          <label>Description</label>
          <textarea id="f-desc" rows="3" placeholder="A short description of the room…"></textarea>
        </div>
        <div class="form-group form-full" style="display:flex;align-items:center;gap:10px">
          <input type="checkbox" id="f-active" checked style="width:18px;height:18px;accent-color:var(--green)">
          <label for="f-active" style="text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:0">Active (visible on site)</label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-btn">Save room</button>
      </div>
    </form>
  </div>
</div>

<!-- ROOM DETAIL DRAWER -->
<div class="room-drawer-backdrop" id="room-drawer-backdrop" onclick="if(event.target===this)closeDrawer()">
  <div class="room-drawer" id="room-drawer">
    <div style="position:relative">
      <img id="drawer-img" src="" alt="" class="room-drawer-img">
      <button class="room-drawer-close" onclick="closeDrawer()">&times;</button>
    </div>
    <div class="room-drawer-body">
      <div class="room-drawer-eyebrow">Accommodation</div>
      <div class="room-drawer-name" id="drawer-name"></div>
      <div class="room-drawer-price" id="drawer-price"></div>
      <div class="room-drawer-specs" id="drawer-specs"></div>
      <p class="room-drawer-desc" id="drawer-desc"></p>
      <ul class="room-drawer-amenities" id="drawer-amenities"></ul>
      <div id="drawer-status" style="margin-bottom:20px"></div>
      <div class="room-drawer-actions">
        <button class="btn btn-primary" id="drawer-edit-btn">Edit this room</button>
        <button class="btn btn-outline" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="js/demo-data.js"></script>
<script src="js/admin-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderShell('rooms');
  document.body.classList.add('ready');
  renderRooms();
});

function renderRooms() {
  const rooms = DemoData.getRooms();
  const grid  = document.getElementById('rooms-grid');
  if (rooms.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><h3>No rooms yet</h3><p>Add your first room using the button above.</p></div>`;
    return;
  }
  grid.innerHTML = rooms.map(r => `
    <div class="room-card" onclick="openDrawer(${r.id})" style="cursor:pointer">
      ${r.image
        ? `<img class="room-card-img" src="${r.image}" alt="${r.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="room-card-img-placeholder" style="${r.image ? 'display:none' : ''}">No image</div>
      <div class="room-card-body">
        <div class="room-card-name">${r.name}</div>
        <div class="room-card-price">From R${r.price}/night</div>
        <div class="room-card-specs">Sleeps ${r.sleeps} · ${r.size_m2}m² · ${r.bed_type}</div>
        <div class="room-card-specs" style="margin-top:2px">${r.bathroom}</div>
        <div style="margin-top:8px"><span class="badge ${r.active ? 'badge-active' : 'badge-hidden'}">${r.active ? 'Active' : 'Hidden'}</span></div>
      </div>
      <div class="room-card-actions" onclick="event.stopPropagation()">
        <button class="btn btn-outline btn-sm" style="flex:1" onclick="editRoom(${r.id})">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteRoom(${r.id})">Delete</button>
      </div>
    </div>`).join('');
}

function openDrawer(id) {
  const r = DemoData.getRooms().find(r => r.id === id);
  if (!r) return;
  const backdrop = document.getElementById('room-drawer-backdrop');

  document.getElementById('drawer-img').src       = r.image || '';
  document.getElementById('drawer-img').style.display = r.image ? 'block' : 'none';
  document.getElementById('drawer-name').textContent  = r.name;
  document.getElementById('drawer-price').textContent = `From R${r.price} / night`;
  document.getElementById('drawer-specs').innerHTML   = [
    `Sleeps ${r.sleeps}`, `${r.size_m2} m²`, r.bed_type, r.bathroom
  ].filter(Boolean).map(s => `<span>${s}</span>`).join('');
  document.getElementById('drawer-desc').textContent  = r.description || '';
  document.getElementById('drawer-desc').style.display = r.description ? 'block' : 'none';

  // SVG icons map
  const AMI_ICONS = {
    wifi:    `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>`,
    tv:      `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>`,
    desk:    `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
    kitchen: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>`,
    safe:    `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>`,
    terrace: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
    view:    `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
    heating: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>`,
    default: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  };

  const ami = Array.isArray(r.amenities) && r.amenities.length
    ? r.amenities
    : ['Free Wi-Fi','Flat-screen TV with Netflix','Work desk','Fridge, microwave & kettle','Heating'];

  document.getElementById('drawer-amenities').innerHTML = ami.map(a => {
    const text = typeof a === 'object' ? a.text : a;
    const iconKey = typeof a === 'object' ? a.icon : 'default';
    const icon = AMI_ICONS[iconKey] || AMI_ICONS.default;
    return `<li style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink)">${icon}${text}</li>`;
  }).join('');

  document.getElementById('drawer-status').innerHTML =
    `<span class="badge ${r.active ? 'badge-active' : 'badge-hidden'}">${r.active ? 'Active' : 'Hidden'}</span>`;
  document.getElementById('drawer-edit-btn').onclick = () => { closeDrawer(); editRoom(id); };

  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  document.getElementById('room-drawer-backdrop').classList.remove('open');
  document.body.style.overflow = '';
}

function openModal(room) {
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-title').textContent = room ? 'Edit Room' : 'Add Room';
  document.getElementById('f-id').value       = room ? room.id : '';
  document.getElementById('f-name').value     = room?.name || '';
  document.getElementById('f-price').value    = room?.price || '';
  document.getElementById('f-sleeps').value   = room?.sleeps || '';
  document.getElementById('f-size').value     = room?.size_m2 || '';
  document.getElementById('f-bed').value      = room?.bed_type || '';
  document.getElementById('f-bathroom').value = room?.bathroom || '';
  document.getElementById('f-image').value    = room?.image || '';
  document.getElementById('f-desc').value     = room?.description || '';
  document.getElementById('f-active').checked = room?.active !== false;
}

function editRoom(id) {
  const room = DemoData.getRooms().find(r => r.id === id);
  if (room) openModal(room);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('room-form').reset();
}

function deleteRoom(id) {
  if (!confirm('Delete this room? This cannot be undone.')) return;
  const rooms = DemoData.getRooms().filter(r => r.id !== id);
  DemoData.saveRooms(rooms);
  renderRooms();
  showToast('Room deleted.', 'success');
}

document.getElementById('room-form').addEventListener('submit', e => {
  e.preventDefault();
  const rooms = DemoData.getRooms();
  const idVal = document.getElementById('f-id').value;
  const id    = idVal ? parseInt(idVal) : null;

  const payload = {
    id:          id || (rooms.length > 0 ? Math.max(...rooms.map(r => r.id)) + 1 : 1),
    name:        document.getElementById('f-name').value.trim(),
    price:       parseInt(document.getElementById('f-price').value) || 0,
    price_unit:  'night',
    sleeps:      parseInt(document.getElementById('f-sleeps').value) || 1,
    size_m2:     parseInt(document.getElementById('f-size').value) || 0,
    bed_type:    document.getElementById('f-bed').value.trim(),
    bathroom:    document.getElementById('f-bathroom').value.trim(),
    image:       document.getElementById('f-image').value.trim(),
    description: document.getElementById('f-desc').value.trim(),
    active:      document.getElementById('f-active').checked,
  };

  if (id) {
    const idx = rooms.findIndex(r => r.id === id);
    if (idx !== -1) rooms[idx] = payload;
  } else {
    rooms.push(payload);
  }

  DemoData.saveRooms(rooms);
  closeModal();
  renderRooms();
  showToast(id ? 'Room updated.' : 'Room added.', 'success');
});
</script>
</body>
</html>
