<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Portal — Nonesi Lodge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2C4235;--gold:#C86D51;--gold-h:#B35A3E;
  --bg:#FBF9F5;--surface:#F2EFE8;--ink:#2B2D2F;--muted:#6B6F6C;--line:rgba(44,66,53,.12);
}
body{background:var(--green);min-height:100svh;display:grid;place-items:center;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:24px}
.card{background:var(--bg);border-radius:20px;padding:clamp(32px,6vw,52px);width:100%;max-width:420px;box-shadow:0 32px 80px rgba(0,0,0,.35)}
.card-logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:2rem;font-style:italic;color:var(--gold);margin-bottom:4px;line-height:1.1}
.card-sub{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:28px}
.demo-notice{background:#FFFBEB;border:1.5px solid #F59E0B;border-radius:12px;padding:16px 18px;margin-bottom:28px}
.demo-notice-title{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#92400E;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.demo-notice-body{font-size:13px;color:#78350F}
.btn-enter{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:none;border-radius:12px;background:var(--green);color:#fff;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .2s,transform .2s;margin-top:4px}
.btn-enter:hover{background:var(--gold);transform:translateY(-1px)}
.footer{text-align:center;margin-top:28px;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.05em}
.back{text-align:center;margin-top:16px;font-size:12px;color:var(--muted)}
.back a{color:var(--gold);font-weight:600;text-decoration:none}
.back a:hover{text-decoration:underline}
</style>
</head>
<body>
<div>
  <div class="card">
    <div class="card-logo">Nonesi Lodge</div>
    <div class="card-sub">Admin Portal</div>

    <div class="demo-notice">
      <div class="demo-notice-title">🔒 Demo Mode</div>
      <div class="demo-notice-body">This is a live demo. No password required. Data is stored locally in your browser.</div>
    </div>

    <a class="btn-enter" href="index.html">Enter Admin Portal →</a>

    <div class="back"><a href="../index.html">← Back to website</a></div>
  </div>
  <div class="footer">Powered by Aya Core Studios</div>
</div>
</body>
</html>
