<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Nonesi Lodge Admin</title>
</head>
<body>
<div class="main">
  <div class="topbar">
    <button class="menu-toggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 class="topbar-title">Gallery</h1>
    <div class="topbar-actions">
      <button class="btn btn-outline btn-sm" onclick="showUploadNotice()">↑ Upload</button>
      <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add Photo</button>
    </div>
  </div>
  <div class="page-body">
    <p style="color:var(--muted);margin-bottom:8px;font-size:13px">Manage gallery images. The first 6 mosaic photos appear on the homepage.</p>

    <div class="section-header" style="margin-top:24px">
      <span class="section-title" id="gallery-count">Photos</span>
      <span style="font-size:12px;color:var(--muted)">First 6 (by sort order) show in the homepage mosaic</span>
    </div>
    <div class="gallery-admin-grid" id="gallery-grid">
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Loading…</div>
    </div>
  </div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Add Photo</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modal-preview-wrap" style="margin-bottom:20px;display:none">
      <img id="modal-preview" src="" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--surface)">
    </div>
    <form id="photo-form">
      <input type="hidden" id="f-id">
      <div class="form-grid">
        <div class="form-group form-full">
          <label>Image path</label>
          <input type="text" id="f-src" required placeholder="../images/gallery-pool.png">
        </div>
        <div class="form-group form-full">
          <label>Caption</label>
          <input type="text" id="f-caption" placeholder="Garden & Pool">
        </div>
        <div class="form-group">
          <label>Sort order</label>
          <input type="number" id="f-order" value="99" min="1">
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:10px;padding-top:22px">
          <input type="checkbox" id="f-mosaic" checked style="width:18px;height:18px;accent-color:var(--green)">
          <label for="f-mosaic" style="text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:0">Show in homepage mosaic</label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="delete-photo-btn" style="display:none" onclick="deleteCurrentPhoto()">Delete photo</button>
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="js/demo-data.js"></script>
<script src="js/admin-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderShell('gallery');
  renderGallery();
});

let editingId = null;

function renderGallery() {
  const photos = DemoData.getGallery().slice().sort((a, b) => a.sort_order - b.sort_order);
  const grid   = document.getElementById('gallery-grid');
  document.getElementById('gallery-count').textContent = `Photos (${photos.length})`;

  if (photos.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><h3>No photos yet</h3><p>Add photos using the button above.</p></div>`;
    return;
  }

  grid.innerHTML = photos.map(p => `
    <div class="gallery-admin-item">
      <img src="${p.src}" alt="${p.caption || ''}" onerror="this.style.opacity='.3'">
      <div class="gallery-admin-item-actions">
        <button class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="openEditModal(${p.id})">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deletePhoto(${p.id})">Delete</button>
      </div>
      <div class="gallery-admin-item-label">${p.caption || ''}</div>
      ${p.in_mosaic ? '<span style="position:absolute;top:8px;right:8px;background:var(--gold);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.08em">MOSAIC</span>' : ''}
    </div>`).join('');
}

function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add Photo';
  document.getElementById('f-id').value = '';
  document.getElementById('f-src').value = '';
  document.getElementById('f-caption').value = '';
  document.getElementById('f-order').value = '99';
  document.getElementById('f-mosaic').checked = true;
  document.getElementById('modal-preview-wrap').style.display = 'none';
  document.getElementById('delete-photo-btn').style.display = 'none';
  document.getElementById('modal').classList.add('open');
}

function openEditModal(id) {
  const photo = DemoData.getGallery().find(p => p.id === id);
  if (!photo) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Photo';
  document.getElementById('f-id').value      = photo.id;
  document.getElementById('f-src').value     = photo.src;
  document.getElementById('f-caption').value = photo.caption || '';
  document.getElementById('f-order').value   = photo.sort_order;
  document.getElementById('f-mosaic').checked = !!photo.in_mosaic;
  document.getElementById('modal-preview').src = photo.src;
  document.getElementById('modal-preview-wrap').style.display = 'block';
  document.getElementById('delete-photo-btn').style.display = 'inline-flex';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

function deleteCurrentPhoto() {
  if (editingId === null) return;
  deletePhoto(editingId);
  closeModal();
}

function deletePhoto(id) {
  if (!confirm('Delete this photo? This cannot be undone.')) return;
  const gallery = DemoData.getGallery().filter(p => p.id !== id);
  DemoData.saveGallery(gallery);
  renderGallery();
  showToast('Photo deleted.', 'success');
}

document.getElementById('photo-form').addEventListener('submit', e => {
  e.preventDefault();
  const gallery = DemoData.getGallery();
  const idVal   = document.getElementById('f-id').value;
  const id      = idVal ? parseInt(idVal) : null;

  const payload = {
    id:         id || (gallery.length > 0 ? Math.max(...gallery.map(p => p.id)) + 1 : 1),
    src:        document.getElementById('f-src').value.trim(),
    caption:    document.getElementById('f-caption').value.trim(),
    sort_order: parseInt(document.getElementById('f-order').value) || 99,
    in_mosaic:  document.getElementById('f-mosaic').checked,
  };

  if (id) {
    const idx = gallery.findIndex(p => p.id === id);
    if (idx !== -1) gallery[idx] = payload;
  } else {
    gallery.push(payload);
  }

  DemoData.saveGallery(gallery);
  closeModal();
  renderGallery();
  showToast(id ? 'Photo updated.' : 'Photo added.', 'success');
});

function showUploadNotice() {
  showToast("In the live version, you'll be able to upload photos directly. For now, enter the image path manually.", 'info');
}
</script>
</body>
</html>
